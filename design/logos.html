<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crible — logos</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f1ea;--ink:#16201d;--soft:#68706b;--line:#dcd7cb;--red:#d9472b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:1120px;margin:0 auto;padding:44px 16px 72px}
h1{font:800 34px/1.1 "Bricolage Grotesque",sans-serif;margin:0 0 8px;letter-spacing:-.02em}
.lead{color:var(--soft);margin:0 0 36px;max-width:70ch}
.piste{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;background:#fff;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;margin-bottom:18px}
.stage{display:grid;place-items:center;min-height:300px;padding:28px;border-right:1px solid var(--line)}
.info{padding:26px 26px 22px;display:flex;flex-direction:column;gap:14px}
.num{font:600 12px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;color:var(--red)}
.info h2{font:800 24px/1.15 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.01em}
.info p{margin:0;color:var(--soft)}
.uses{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:auto}
.tab{display:flex;align-items:center;gap:8px;background:#e9e5dc;border-radius:8px 8px 0 0;padding:7px 12px;font:500 13px "IBM Plex Mono",monospace;color:#3b4340}
.dark{background:#121816;border-radius:10px;padding:14px 18px;display:grid;place-items:center}
.tiny{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px dashed var(--line);border-radius:8px}
@media (max-width:760px){.piste{grid-template-columns:1fr}.stage{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<main>
  <h1>Crible — logos, deuxième série</h1>
  <p class="lead">Chaque piste part d'une idée qui n'appartient qu'à Crible, avec une loupe dans chacune. Pour chaque piste : le logo en grand, son usage en icône d'onglet à 16 px, et sa version sur fond sombre.</p>
  <div id="list"></div>
</main>
<script>
const INK = "#16201d", RED = "#d9472b", PAPER = "#f4f1ea", LIGHT = "#f4f1ea";

/* ---------- 1. le i de crible est une loupe ---------- */
// le point du i devient la lentille, le fût du i devient le manche. Tout se
// mesure sur la taille de police, pour que le i ait le poids des autres lettres
function iLoupe(ink, red, size) {
  // origine : pied du fût, sur la ligne de base
  const stem = size * 0.112, xh = size * 0.52, r = size * 0.145, ring = size * 0.052;
  const cy = -xh - r * 1.12;
  return `<g transform="rotate(-11 ${stem / 2} 0)">
    <rect x="0" y="${-xh}" width="${stem}" height="${xh}" rx="${stem / 2}" fill="${ink}"/>
    <circle cx="${stem / 2}" cy="${cy}" r="${r}" fill="none" stroke="${ink}" stroke-width="${ring}"/>
    <circle cx="${stem / 2}" cy="${cy}" r="${r * 0.36}" fill="${red}"/>
  </g>`;
}
function wordmarkI(ink, red, size) {
  // les lettres sont posées par mesure réelle de la police
  const c = document.createElement("canvas").getContext("2d");
  c.font = `800 ${size}px "Bricolage Grotesque"`;
  const ls = -size * 0.012;
  const x1 = c.measureText("cr").width + ls * 2, x2 = c.measureText("ble").width + ls * 3;
  const gapL = size * 0.1, gapR = size * 0.07, stem = size * 0.112;
  const W = x1 + gapL + stem + gapR + x2, base = size * 1.02, H = size * 1.22;
  return { w: W, h: H, svg: `
    <text x="0" y="${base}" font-family="Bricolage Grotesque" font-weight="800" font-size="${size}" fill="${ink}" letter-spacing="${ls}">cr</text>
    <g transform="translate(${x1 + gapL} ${base})">${iLoupe(ink, red, size)}</g>
    <text x="${x1 + gapL + stem + gapR}" y="${base}" font-family="Bricolage Grotesque" font-weight="800" font-size="${size}" fill="${ink}" letter-spacing="${ls}">ble</text>` };
}

/* ---------- 2. la plaque de crible ---------- */
// un vrai crible est une tôle percée de trous ronds en quinconce : sous la
// loupe, tous les trous sont vides sauf un, qui retient un grain
function plate(ink, red, bg, id) {
  let holes = "";
  const s = 8.2;
  for (let r = -6; r <= 6; r++) for (let q = -6; q <= 6; q++) {
    const x = 42 + q * s + (r % 2 ? s / 2 : 0), y = 42 + r * s * 0.866;
    const keep = r === 1 && q === 1;
    holes += keep ? `<circle cx="${x}" cy="${y}" r="3.4" fill="${red}"/>` : `<circle cx="${x}" cy="${y}" r="2.5" fill="none" stroke="${ink}" stroke-width="1.5" opacity=".55"/>`;
  }
  return `<defs><clipPath id="${id}"><circle cx="42" cy="42" r="24"/></clipPath></defs>
    <g clip-path="url(#${id})">${holes}</g>
    <circle cx="42" cy="42" r="28" fill="none" stroke="${ink}" stroke-width="7.5"/>
    <path d="M62 62 L84 84" stroke="${ink}" stroke-width="12" stroke-linecap="round"/>`;
}

/* ---------- 3. le grossissement ---------- */
// une grille de cellules (un tableau) ; dans la lentille, la même grille
// grossie deux fois et demie : on y voit la seule cellule fausse, invisible
// à l'œil nu
function magnify(ink, red, bg, id) {
  let small = "", big = "";
  const cell = 6;
  for (let r = 0; r < 14; r++) for (let c = 0; c < 14; c++) {
    const x = 4 + c * cell, y = 4 + r * cell;
    small += `<rect x="${x}" y="${y}" width="${cell - 1.6}" height="${cell - 1.6}" fill="${ink}" opacity=".16"/>`;
  }
  const k = 2.5, ox = 38, oy = 38;
  for (let r = -3; r <= 3; r++) for (let c = -3; c <= 3; c++) {
    const x = ox + (c * cell) * k, y = oy + (r * cell) * k;
    const bad = r === 0 && c === 0;
    big += `<rect x="${x - cell * k / 2}" y="${y - cell * k / 2}" width="${(cell - 1.6) * k}" height="${(cell - 1.6) * k}" rx="1.2" fill="${bad ? red : ink}" opacity="${bad ? 1 : 0.32}"/>`;
  }
  return `<defs><clipPath id="${id}"><circle cx="40" cy="40" r="22"/></clipPath>
    <radialGradient id="${id}f" cx="40" cy="40" r="46" gradientUnits="userSpaceOnUse"><stop offset=".55" stop-color="${bg}" stop-opacity="0"/><stop offset="1" stop-color="${bg}" stop-opacity="1"/></radialGradient></defs>
    ${small}<rect width="100" height="100" fill="url(#${id}f)"/>
    <circle cx="40" cy="40" r="22" fill="${bg}"/><g clip-path="url(#${id})">${big}</g>
    <circle cx="40" cy="40" r="25.5" fill="none" stroke="${ink}" stroke-width="7"/>
    <path d="M58.5 58.5 L82 82" stroke="${ink}" stroke-width="11" stroke-linecap="round"/>`;
}

/* ---------- 4. le tampon de contrôle ---------- */
// le tampon que l'inspecteur appose sur ce qui a été contrôlé ; le texte fait
// exactement le tour, entre les deux anneaux
function stamp(ink, red, bg, id) {
  const col = red, R = 40.6, len = 2 * Math.PI * R;
  return `<defs><path id="${id}" d="M50,${50 + R} a${R},${R} 0 1,1 0.01,0"/></defs>
    <g transform="rotate(-9 50 50)">
      <circle cx="50" cy="50" r="47.5" fill="none" stroke="${col}" stroke-width="3"/>
      <circle cx="50" cy="50" r="38" fill="none" stroke="${col}" stroke-width="1.3"/>
      <text font-family="IBM Plex Mono" font-weight="600" font-size="6.4" fill="${col}">
        <textPath href="#${id}" textLength="${len - 3}" lengthAdjust="spacing">PASSÉ AU CRIBLE · CONTRÔLÉ · PASSÉ AU CRIBLE · CONTRÔLÉ ·</textPath></text>
      <circle cx="46" cy="46" r="13" fill="none" stroke="${col}" stroke-width="4.6"/>
      <path d="M55.6 55.6 L66.5 66.5" stroke="${col}" stroke-width="6.6" stroke-linecap="round"/>
    </g>`;
}

/* ---------- 5. le grain retenu ---------- */
// l'anneau de la loupe est lui-même percé, comme le bord d'un tamis ; un
// seul grain reste au centre
function grain(ink, red, bg) {
  let dots = "";
  const n = 22;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    dots += `<circle cx="${42 + Math.cos(a) * 27}" cy="${42 + Math.sin(a) * 27}" r="3.7" fill="${ink}"/>`;
  }
  return `${dots}<circle cx="42" cy="42" r="7" fill="${red}"/>
    <path d="M63 63 L85 85" stroke="${ink}" stroke-width="12" stroke-linecap="round"/>`;
}

const PISTES = [
  { name: "Le i loupe", kind: "word",
    why: "La loupe n'est pas posée à côté du nom : elle est dans le nom. Le point du i devient la lentille, le fût devient le manche, légèrement incliné. Un grain rouge marque ce que la loupe a trouvé. En icône, le i seul suffit." },
  { name: "La plaque de crible", fn: plate,
    why: "Un vrai crible est une tôle percée de trous ronds en quinconce. Sous la loupe, tous les trous sont vides, sauf un qui retient un grain. Le sens du mot, littéralement, et une texture qu'on reconnaît." },
  { name: "Le grossissement", fn: magnify,
    why: "Un tableau de cellules minuscules, et dans la lentille la même grille grossie deux fois et demie. On y voit la seule cellule fausse, invisible à l'œil nu. C'est la promesse de l'outil, montrée par l'optique." },
  { name: "Le tampon de contrôle", fn: stamp,
    why: "Le tampon qu'un inspecteur appose sur ce qu'il a contrôlé : « PASSÉ AU CRIBLE · CONTRÔLÉ », une loupe au centre, imprimé de biais à l'encre rouge. Il peut aussi marquer les rapports exportés." },
  { name: "Le grain retenu", fn: grain,
    why: "L'anneau de la loupe est lui-même percé, comme le bord d'un tamis, et un seul grain reste au centre. C'est la forme la plus simple de la série, qui tient en une couleur et reste nette à 16 px." },
];

let id = 0;
const svg = (inner, w, h, vw = 100, vh = 100) => `<svg viewBox="0 0 ${vw} ${vh}" width="${w}" height="${h}" aria-hidden="true">${inner}</svg>`;
function render() {
  document.getElementById("list").innerHTML = PISTES.map((p, i) => {
    let hero, ico16, dark;
    if (p.kind === "word") {
      const wm = wordmarkI(INK, RED, 120), wmD = wordmarkI(LIGHT, "#ff7752", 120);
      hero = svg(wm.svg, 360, 360 * wm.h / wm.w, wm.w, wm.h);
      const icon = (ink, red) => svg(`<g transform="translate(50 94)">${iLoupe(ink, red, 108)}</g>`, 0, 0, 100, 100);
      ico16 = icon(INK, RED).replace('width="0" height="0"', 'width="16" height="16"');
      const ico32 = icon(INK, RED).replace('width="0" height="0"', 'width="32" height="32"');
      ico16 = ico32 + ico16;
      dark = svg(wmD.svg, 190, 190 * wmD.h / wmD.w, wmD.w, wmD.h);
    } else {
      const mk = (ink, red, bg, s) => svg(p.fn(ink, red, bg, "g" + (id++)), s, s);
      // à côté de la marque, le nom dans la même voix que le i loupe
      const name = (col, fs) => `<span style="font:800 ${fs}px/1 'Bricolage Grotesque';color:${col};letter-spacing:-.02em">crible</span>`;
      hero = `<div style="display:flex;align-items:center;gap:18px">${mk(INK, RED, "#ffffff", 150)}${name(INK, 64)}</div>`;
      ico16 = mk(INK, RED, "#e9e5dc", 32) + mk(INK, RED, "#e9e5dc", 16);
      dark = `<div style="display:flex;align-items:center;gap:12px">${mk(LIGHT, "#ff7752", "#121816", 46)}${name(LIGHT, 30)}</div>`;
    }
    return `<section class="piste">
      <div class="stage">${hero}</div>
      <div class="info">
        <div class="num">PISTE ${String(i + 1).padStart(2, "0")}</div>
        <h2>${p.name}</h2>
        <p>${p.why}</p>
        <div class="uses">
          <div class="tab">${ico16} crible</div>
          <div class="dark">${dark}</div>
        </div>
      </div>
    </section>`;
  }).join("");
}
document.fonts.load('800 40px "Bricolage Grotesque"').then(() => document.fonts.ready).then(() => { render(); window.__ready = true; });
</script>
</body>
</html>
